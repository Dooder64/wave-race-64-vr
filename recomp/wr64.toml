# N64Recomp configuration for Wave Race 64 (USA) (Rev A).
#
# The input is the assembly-only ELF built by tools/wsl_build_all.sh, verified
# byte-identical to the cartridge across all 32 segments. See
# docs/PHASE01-FINDINGS.md for what that took.

[input]

# Paths are resolved relative to this file, not the working directory.
#
# Elf input mode. docs/PLAN.md records why this project does not use
# symbols_file_path: reference symbol files and the single-file-output patch
# workflow are both rejected outside elf input mode, and phase 04 needs them.
elf_path = "../wr64.elf"

# Read from offset 0x08 of the cartridge header and confirmed against the
# decomp's `entry` segment. Not the usual 0x80000400 -- worth checking rather
# than assuming.
entrypoint = 0x80046800

# Route every function call through the runtime's function lookup.
#
# Wave Race 64's resident code calls directly into its overlays, and nineteen
# sections share vram 0x802C5800, so a call target address cannot say on its own
# which function is meant -- only what is loaded at the time can. resolve_jal
# correctly refuses to guess, which is why func_80092CF0 and two others could
# not be recompiled at all and had to be stubbed in phase 02.
#
# With this on, calls resolve against whatever is currently loaded, which is the
# semantics an overlay needs. The cost is a lookup per call rather than a direct
# one. Correctness first; if it shows up in profiling, the answer is to make the
# lookup faster, not to go back to guessing.
#
# The key does not exist upstream. tools/patch_n64recomp.py adds it, exposing a
# context field the recompiler already had but never let the CLI set.
use_lookup_for_all_function_calls = true

# Generated C. Regenerated from the user's own ROM; gitignored.
output_func_path = "../RecompiledFuncs"

# ~1,350 functions at 50 per file is roughly two dozen translation units, which
# keeps incremental rebuilds tolerable during phase 04.
functions_per_output_file = 50

# Replaces the `#include "recomp.h"` line at the top of every generated file.
#
# The extra header declares the libultra functions N64Recomp delegates to the
# runtime. It renames those to <name>_recomp, but funcs.h only declares
# functions that were recompiled, so ten calls would otherwise be implicit
# declarations and fail under C99. Generated by tools/gen_reimplemented_decls.py.
recomp_include = """#include "recomp.h"
#include "reimplemented_decls.h""""

# The 19 sections that load at vram 0x802C5800: sixteen numbered overlays plus
# segment_1B1FB0, seg_1C3780 and seg_1C3D00.
#
# Both prior public Wave Race 64 attempts disabled this line because their ELF
# carried no relocation data. Ours has 22 .rel.* sections including one per
# overlay, so it can stay on.
relocatable_sections_path = "overlays.txt"

[patches]

# Resident functions that `jal` directly into the overlay window at 0x802C5800.
#
# N64Recomp cannot resolve these statically, and that is by design rather than a
# gap: resolve_jal() never treats a function in a relocatable section as a
# candidate from another section, because which overlay is resident is a runtime
# fact. The escape hatch, use_lookup_for_all_function_calls, is a context field
# with no config key -- not in our pinned revision and not upstream either.
#
# So these three are stubbed to let the other ~1,343 functions through. They are
# not optional: func_80092CF0 has 20 distinct overlay targets and is almost
# certainly the overlay dispatcher itself. Phase 04 has to reimplement them as
# RECOMP_PATCH functions that dispatch through the runtime's overlay lookup.
#
# Found by tools/jal_scan.py; see docs/PHASE02-FINDINGS.md.
# func_80092CF0 is NOT here: it is in `ignored` below, because patches/ now
# provides a real definition. Stubbing emits an empty body into the recompiled
# library, and a patch defining the same symbol then collides -- RECOMP_FUNC is
# weak, but on PE/COFF the archive member is pulled in for the other functions
# sharing its object file, so both definitions reach the link and lld-link
# reports a duplicate. `ignored` emits nothing, leaving the field clear.
stubs = [
    # Empty. func_80092CF0, func_800922E4 and PauseMenu_Update were stubbed in
    # phase 02 because they jal directly into the overlay window and could not
    # be resolved statically. use_lookup_for_all_function_calls resolves those
    # calls at runtime instead, so all three are now recompiled properly.
]

# The tail of __osException that splat split off into its own symbol.
#
# libultra/exceptasm.s is hand-written assembly whose control flow crosses the
# boundaries splat assigned: func_800CB0A8 branches back to .L800CB060, inside
# __osException. They are one routine, which is why the recompiler rejected it.
#
# Its seven neighbours -- __osException, __osExceptionPreamble,
# __osEnqueueAndYield, __osEnqueueThread, __osPopThread, __osDispatchThread and
# __osCleanupThread -- need no entry here. N64Recomp already carries them in its
# built-in reimplemented_funcs list, renames them to <name>_recomp and delegates
# to ultramodern, which implements threads, scheduling and exceptions on the
# host. Listing them is in fact an error: the rename removes the original name,
# so the config lookup fails with "does not exist".
#
# This one is not in that list because splat invented the name, so it has to be
# dropped by hand. Nothing is lost -- the runtime provides the whole routine.
ignored = [
    "func_800CB0A8",
    # Splat's textbin labels are typed as functions, but these are RSP
    # microcode blobs, not R4300 CPU functions. RT64 handles graphics and
    # RSPRecomp separately translates aspMain for audio. Preserve their bytes
    # in the ROM/ELF without feeding them to the CPU recompiler. rspboot is
    # already in N64Recomp's built-in ignored list.
    "gspFast3DTextStart",
    "aspMainTextStart",
    # Replaced by patches/dma.cpp with a synchronous transfer, so loaded code is
    # in place before the call returns rather than after a queue wait.
    "game_dma_copy"
]

# VR: draw objects all round the camera, and farther.
#
# func_8006E674 decides, every frame, which course objects are drawn. For each
# of three groups -- visibility in D_801C0840, D_801C08C0 and D_801C0AC0, read
# only by drawing code -- it leaves out an object farther than a distance from
# the course's settings, or off to the side of the camera's heading: cosine
# above 0.5 (60 degrees) for the first two groups, above 0 (90 degrees) for
# the third. A flat screen never sees past that; a headset looks everywhere.
#
# These hooks put a line before the instructions that decide it, so nothing
# generated is edited by hand. Each asks the port (src/vr.cpp) whether VR wants
# objects all round, and only then changes anything: the direction tests are
# made to pass, and the distances the groups fade out between are scaled. The
# registers changed are written again before anything else reads them, which
# was checked in the generated code. See docs/VR-CULLING.md.

# The fade-start and cut-off distances, s1 and s2, loaded at 0x8006E9A4 and in
# the delay slot at 0x8006E9AC and used by all three groups. They are read
# again from the course settings rather than scaled in place, because the
# second hook also runs after the first when the first group has objects.
[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006E9B0
text = '{ extern int wr64_vr_draw_distance(int value); int settings = MEM_W(0, (int32_t)0x801C0C80); ctx->r17 = (int32_t)wr64_vr_draw_distance(MEM_W(0xA0, settings)); ctx->r18 = (int32_t)wr64_vr_draw_distance(MEM_W(0xA4, settings)); }'

# Where the branch skipping an empty first group lands.
[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006EBC0
text = '{ extern int wr64_vr_draw_distance(int value); int settings = MEM_W(0, (int32_t)0x801C0C80); ctx->r17 = (int32_t)wr64_vr_draw_distance(MEM_W(0xA0, settings)); ctx->r18 = (int32_t)wr64_vr_draw_distance(MEM_W(0xA4, settings)); }'

# First group: c.lt.s $f10, $f8 -- 0.5 < cosine. The threshold goes below any
# cosine.
[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006EAF4
text = '{ extern int wr64_vr_all_round(void); if (wr64_vr_all_round()) ctx->f10.fl = -2.0f; }'

# Second group: c.lt.s $f8, $f4 -- 0.5 < cosine.
[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006ECA4
text = '{ extern int wr64_vr_all_round(void); if (wr64_vr_all_round()) ctx->f8.fl = -2.0f; }'

# Second group's facing matrices (race and boundary buoys turn to the camera):
# each player has room for 32, at 0xA1C0 + 0x800 * player of the frame's
# buffer, and the game stops handing them out at 32 (slti $t5, 0x20). Seen
# all round, many more are in view, and those past the cap -- the highest
# numbered, the last buoys of a lap -- keep a stale matrix and are drawn on
# top of another buoy or at the finish line. With one player they move to an
# area of their own with room for 256 (wr64_vr_facing_area in src/vr.cpp):
# the base each is written at ($s3, added to the buffer's address), the cap
# (the test's result, $at, just before its branch), and the base the display
# list addresses them from ($s2, physical, segment 0).
[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006EF34
text = '{ extern uint32_t wr64_vr_facing_area(uint32_t buffer, int players); uint32_t buffer = (uint32_t)MEM_W(0, (int32_t)0x801AE948); uint32_t area = wr64_vr_facing_area(buffer, MEM_W(0, (int32_t)0x800DAB28)); if (area != 0) ctx->r19 = (int32_t)(0x80000000u + area - buffer); }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006F020
text = '{ extern uint32_t wr64_vr_facing_area(uint32_t buffer, int players); if (wr64_vr_facing_area((uint32_t)MEM_W(0, (int32_t)0x801AE948), MEM_W(0, (int32_t)0x800DAB28)) != 0) ctx->r1 = SIGNED(ctx->r13) < 0x100 ? 1 : 0; }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006F1C0
text = '{ extern uint32_t wr64_vr_facing_area(uint32_t buffer, int players); uint32_t area = wr64_vr_facing_area((uint32_t)MEM_W(0, (int32_t)0x801AE948), MEM_W(0, (int32_t)0x800DAB28)); if (area != 0) ctx->r18 = (int32_t)area; }'

# The race buoys (the first group) have the same trouble with a smaller
# limit: 12 a player (slti $t5, 0xC), their matrices at 0x95C0 (the buoy)
# and 0x9BC0 (its marker) + 0x300 * player of the frame's buffer. With one
# player they move to areas of their own with room for 64
# (wr64_vr_buoy_area): the three writes ($at, the area's offset, just
# before it is added to the address), the cap, and the three bases the
# display list addresses them from ($s2).
[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006FEF0
text = '{ extern uint32_t wr64_vr_buoy_area(uint32_t, int, int); uint32_t buffer = (uint32_t)MEM_W(0, (int32_t)0x801AE948); uint32_t area = wr64_vr_buoy_area(buffer, MEM_W(0, (int32_t)0x800DAB28), 0); if (area != 0) ctx->r1 = (int32_t)(0x80000000u + area - buffer); }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006FFD0
text = '{ extern uint32_t wr64_vr_buoy_area(uint32_t, int, int); uint32_t buffer = (uint32_t)MEM_W(0, (int32_t)0x801AE948); uint32_t area = wr64_vr_buoy_area(buffer, MEM_W(0, (int32_t)0x800DAB28), 1); if (area != 0) ctx->r1 = (int32_t)(0x80000000u + area - buffer); }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x800700D4
text = '{ extern uint32_t wr64_vr_buoy_area(uint32_t, int, int); uint32_t buffer = (uint32_t)MEM_W(0, (int32_t)0x801AE948); uint32_t area = wr64_vr_buoy_area(buffer, MEM_W(0, (int32_t)0x800DAB28), 0); if (area != 0) ctx->r1 = (int32_t)(0x80000000u + area - buffer); }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8007010C
text = '{ extern uint32_t wr64_vr_buoy_area(uint32_t, int, int); if (wr64_vr_buoy_area((uint32_t)MEM_W(0, (int32_t)0x801AE948), MEM_W(0, (int32_t)0x800DAB28), 0) != 0) ctx->r1 = SIGNED(ctx->r13) < 0x40 ? 1 : 0; }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x80070164
text = '{ extern uint32_t wr64_vr_buoy_area(uint32_t, int, int); uint32_t area = wr64_vr_buoy_area((uint32_t)MEM_W(0, (int32_t)0x801AE948), MEM_W(0, (int32_t)0x800DAB28), 0); if (area != 0) ctx->r18 = (int32_t)area; }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8007117C
text = '{ extern uint32_t wr64_vr_buoy_area(uint32_t, int, int); uint32_t area = wr64_vr_buoy_area((uint32_t)MEM_W(0, (int32_t)0x801AE948), MEM_W(0, (int32_t)0x800DAB28), 0); if (area != 0) ctx->r18 = (int32_t)area; }'

[[patches.hook]]
func = "func_8006E674"
before_vram = 0x80071434
text = '{ extern uint32_t wr64_vr_buoy_area(uint32_t, int, int); uint32_t area = wr64_vr_buoy_area((uint32_t)MEM_W(0, (int32_t)0x801AE948), MEM_W(0, (int32_t)0x800DAB28), 1); if (area != 0) ctx->r18 = (int32_t)area; }'

# Third group: c.lt.s $f24, $f4 -- 0 < cosine. $f24 holds zero for the rest of
# the function, so the cosine is raised instead.
[[patches.hook]]
func = "func_8006E674"
before_vram = 0x8006EDFC
text = '{ extern int wr64_vr_all_round(void); if (wr64_vr_all_round()) ctx->f4.fl = 2.0f; }'

# Free Roam's wave intensity: the water is set up for a course by
# func_8004F9E0 (a0 the water's height, a1 the wave level, D_800D49B0); on
# its way in, the port may give another level (patches/free_roam.cpp).
[[patches.hook]]
func = "func_8004F9E0"
before_vram = 0x8004F9E0
text = '{ extern int wr64_wave_level(uint8_t* rdram, int level); ctx->r5 = (int32_t)wr64_wave_level(rdram, (int)ctx->r5); }'

# Free Roam without the announcer: voice lines are queued by func_800C32A0
# (a0 the line, a1 its priority, a2 how long it holds the channel), directly
# or after a delay (func_800C338C, then func_800C3494); on its way in, the
# port is asked whether to leave the line out (patches/free_roam.cpp).
[[patches.hook]]
func = "func_800C32A0"
before_vram = 0x800C32A0
text = '{ extern int wr64_voice_silenced(uint8_t* rdram, int line, int priority, uint32_t caller); if (wr64_voice_silenced(rdram, (int)ctx->r4, (int)ctx->r5, (uint32_t)ctx->r31)) { ctx->r2 = 0; return; } }'

# Free Roam without the start's beeps: on the way into AudioGeneral_PlaySound
# (a0 the sound), before anything is done, the port is asked whether to leave
# it out (patches/free_roam.cpp).
[[patches.hook]]
func = "AudioGeneral_PlaySound"
before_vram = 0x800C37F4
text = '{ extern int wr64_sound_silenced(uint8_t* rdram, int sound); if (wr64_sound_silenced(rdram, (int)ctx->r4)) return; }'

# Music select: on the way into func_800C1540 (a0 the sequence to start), a
# course's music in a race becomes the chosen course's (patches/free_roam.cpp).
[[patches.hook]]
func = "func_800C1540"
before_vram = 0x800C1540
text = '{ extern int wr64_race_music(uint8_t* rdram, int sequence); ctx->r4 = (int32_t)wr64_race_music(rdram, (int)ctx->r4); }'

